[package]
name = "finn"
version = "0.4.0"
edition = "2024"
description = "The package manager for the Fin programming language."
license = "GPL-3.0-only"
repository = "https://github.com/M1778/finn"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
colored = "2.0"
walkdir = "2.4"
which = "5.0"
tempfile = "3.8"
dirs = "5.0"
indicatif = "0.17"
dialoguer = "0.11"
sha2 = "0.10"
hex = "0.4"
fs_extra = "1.3"
reqwest = { version = "0.11", features = ["blocking", "json"] }
thiserror = "1.0" 

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
mockito = "1.2"   
