name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing to build must not cancel the others: a release that ships four of
      # five architectures is a partial release, and finding that out from four cancelled jobs
      # tells you nothing about which one is actually broken.
      fail-fast: false
      matrix:
        include:
          # The asset name carries OS *and* architecture, which is what ADR-0010 requires and
          # what `install.sh` constructs from `uname -s` and `uname -m`. The pairing is checked
          # by `tests/packaging_tests.rs`, because the failure it prevents -- an arm64 user
          # served an x86_64 binary -- is silent until the kernel refuses to exec it.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: finn
            asset: finn-linux-x86_64.tar.gz
          # A native arm64 Linux runner rather than a cross-compile: cross-compiling
          # aarch64-unknown-linux-gnu needs a separate linker package and an environment
          # override, and every one of those is an assumption this repository cannot test
          # locally. If the label is ever unavailable the job does not start, the arm64 asset is
          # absent, and `install.sh` 404s and says so -- which is the current behaviour and not
          # a wrong binary.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: finn
            asset: finn-linux-aarch64.tar.gz
          # Both macOS builds run on the arm64 runner. aarch64 is native; x86_64 is a
          # cross-compile the Apple toolchain does without extra packages.
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: finn
            asset: finn-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: finn
            asset: finn-macos-x86_64.tar.gz
          # No aarch64-pc-windows-msvc entry: there is no arm64 Windows runner to build it on,
          # `installer.iss` hardcodes the x86_64 target directory, and an untested cross-compile
          # published under an arm64 name would be worse than its absence. An arm64 Windows user
          # is refused by name rather than handed something.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: finn.exe
            asset: finn-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # --- BUILD PHASE ---
      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      # --- PACKAGING ---
      #
      # The archive holds the binary and nothing else. `install.sh` untars it straight into
      # $HOME/.finn/bin, so anything else in here becomes a file on the user's PATH -- which is
      # how README.md came to be installed as an executable's neighbour on every platform.
      - name: Package Windows Portable (ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path finn-portable
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary_name }} finn-portable/
          Compress-Archive -Path finn-portable/* -DestinationPath ${{ matrix.asset }}

      - name: Build Windows Installer (Inno Setup)
        if: runner.os == 'Windows'
        uses: MinnowWare/action-iscc@v1
        with:
          iss_path: ./installer.iss

      - name: Rename Installer Output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path installer_output/finn_setup_windows.exe) {
            Move-Item installer_output/finn_setup_windows.exe finn-setup-windows.exe
          }

      - name: Package Unix Portable (Tarball)
        if: runner.os != 'Windows'
        run: |
          mkdir finn-portable
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} finn-portable/
          tar -czf ${{ matrix.asset }} -C finn-portable .

      # --- CHECKSUM PHASE ---
      #
      # `install.sh` fetches `<asset>.sha256` and refuses to install unverified, but it can only
      # verify against a checksum that exists: with none published, every install took the "the
      # server returned 404, so nothing to check against" branch and the verification code was
      # decoration. This is the step that makes it reachable.
      #
      # What it does and does not prove: a checksum served from the same release as the archive
      # detects corruption and truncation in transit. It is not a signature and it does not
      # detect a tampered-with release, because whoever could replace the archive could replace
      # this file beside it.
      #
      # The digest is lowercase hex followed by two spaces and the file name -- `sha256sum`'s own
      # format, which is what `install.sh` parses (first field of the first line).
      - name: Publish Checksums (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # macOS runners have `shasum` and no `sha256sum`; Linux runners have both.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"

      # `Set-Content -Encoding ascii` is not decoration. Windows PowerShell's default output
      # encoding is UTF-16LE, and a UTF-16 checksum file reaches `install.sh` as bytes no `awk`
      # can read a hex digest out of -- the install would refuse a correct archive. The CRLF
      # this leaves behind is handled on the reading side (`tr -d '\r'`).
      - name: Publish Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($asset in @('${{ matrix.asset }}', 'finn-setup-windows.exe')) {
            if (Test-Path $asset) {
              $digest = (Get-FileHash -Algorithm SHA256 -Path $asset).Hash.ToLower()
              Set-Content -Path "$asset.sha256" -Value "$digest  $asset" -Encoding ascii
              Get-Content "$asset.sha256"
            }
          }

      # --- UPLOAD PHASE ---
      #
      # `fail_on_unmatched_files` is on deliberately. Without it a packaging step that produced
      # nothing uploads nothing and the release still succeeds green, which is exactly how a
      # platform quietly stops shipping. Each job names only the files it built, so an unmatched
      # pattern here means a real failure rather than a job that was never meant to produce it.
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

      - name: Upload Windows Installer to Release
        uses: softprops/action-gh-release@v1
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            finn-setup-windows.exe
            finn-setup-windows.exe.sha256
