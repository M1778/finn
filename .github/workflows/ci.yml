name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # The release-smoke job installs the newest *published* compiler, so its verdict changes
  # when someone publishes a release, not when this repository changes. Without a manual
  # trigger the only way to re-check it after a release is to push a commit, which is a
  # strange thing to require.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache dependencies
      uses: swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt -- --check

    - name: Check every source file carries the project header
      shell: bash
      run: python3 scripts/fin_header.py --repo finn --license MIT --check src tests build.rs

    - name: Lint with Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Run Tests
      run: cargo test --verbose

  # The unit and integration suites use fixtures, which is right: they must run without
  # network access. This job exists because a fixture cannot catch a release that is
  # packed wrong -- the published v1.0.0 artifacts segfault, and only an end-to-end
  # install found it.
  #
  # It installs whatever the newest published release is and then uses it for real. If
  # that release is broken, this is red, and that is the correct signal: the newest thing
  # a user can download does not work.
  release-smoke:
    name: install the published release end to end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A push or a manual dispatch, not pull_request: it needs the network and a real
    # published release, so a fork's PR must not go red for a reason the author cannot fix.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # EXPECTED RED until `v1.0.1` is published. This job exists to install the newest
    # published release and build a program with it, and the newest published release today
    # is `v1.0.0`, whose glibc and macOS artifacts do not start. That is the defect the job
    # was written to catch, and it caught it.
    #
    # When 1.0.1 is published these go green with no change here -- the job reads
    # `releases/latest` by way of the API, not a pinned version. If they are still red after
    # 1.0.1 ships, read the failure rather than this comment: it is no longer expected.
    strategy:
      # One platform's broken artifact must not hide the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: swatinem/rust-cache@v2

    - name: Build finn
      shell: bash
      run: cargo build --release

    # On Linux the glibc artifact needs the pinned LLVM runtime, which INSTALL.md says
    # plainly. Installing it here is what a user following the docs does, so this proves
    # the documented path rather than a path only CI can take.
    - name: Install the documented LLVM runtime (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -eu
        if ldconfig -p 2>/dev/null | grep -q 'libLLVM.so.22'; then
          echo "libLLVM.so.22 already present"
          exit 0
        fi
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
        codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
        echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-22 main" \
          | sudo tee /etc/apt/sources.list.d/llvm22.list > /dev/null
        sudo apt-get update -qq
        sudo apt-get install -y -qq libllvm22

    - name: Install the newest published finc and use it
      shell: bash
      env:
        FINN_TEST_HOME: ${{ runner.temp }}/finn-home
      run: |
        set -eu
        # Absolute: this script `cd`s into the generated project later, and a relative path
        # stops resolving at that point. That is exactly how the first run of this job failed
        # on all three platforms, after the download and `init` had both succeeded.
        BIN="$PWD/target/release/finn"
        [ -f "$BIN.exe" ] && BIN="$BIN.exe"
        "$BIN" download
        # A glob does not expand inside an assignment, so `FINC="$dir"/*/bin/finc` stores the
        # literal pattern and every later use fails with "No such file or directory" -- which
        # is what all three lanes did on their first real run. `find` is the portable way to
        # name the one installed binary, and it works for `finc` and `finc.exe` alike.
        FINC="$(find "$FINN_TEST_HOME/.finn/toolchains" -maxdepth 3 -type f \( -name finc -o -name finc.exe \) | head -1)"
        if [ -z "$FINC" ]; then
          echo "::error::finn download reported success but there is no bin/finc under $FINN_TEST_HOME/.finn/toolchains"
          find "$FINN_TEST_HOME/.finn/toolchains" -type f | head -20
          exit 1
        fi
        echo "using $FINC"
        "$FINC" --version
        # A compiler that runs but cannot build is not installed. Build one program.
        printf 'fun main() <noret> { printf("release smoke\\n"); }\n' > smoke.fin
        FIN_COMPILER_PATH="$FINC" "$BIN" init "${{ runner.temp }}/Smoke" --yes
        cp smoke.fin "${{ runner.temp }}/Smoke/src/main.fin"
        ( cd "${{ runner.temp }}/Smoke" && FIN_COMPILER_PATH="$FINC" "$BIN" build )
        ( cd "${{ runner.temp }}/Smoke" && ./out/Smoke )
